esphome:
  name: doorbell
  friendly_name: Doorbell

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf

psram:
  mode: octal
  speed: 80MHz

packages:
  core: !include debug.yaml

# Enable logging
logger:

# Enable Home Assistant API
api:
  encryption:
    key: !secret "home_assistant_api_key"

ota:
  - platform: esphome
    encryption:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # Light power save delays the play command by up to a DTIM interval, and a
  # doorbell should ring at once. The chime is mains powered.
  power_save_mode: none

i2s_audio:
  i2s_lrclk_pin: GPIO07
  i2s_bclk_pin: GPIO08

speaker:
  - platform: i2s_audio
    id: i2s_speaker
    dac_type: external
    i2s_dout_pin: GPIO09
    sample_rate: 48000
    channel: mono
  - platform: mixer
    output_speaker: i2s_speaker
    source_speakers:
      - id: announcement_mixer_speaker
      - id: media_mixer_speaker
  - platform: resampler
    id: announcement_speaker
    output_speaker: announcement_mixer_speaker
  - platform: resampler
    id: media_speaker
    output_speaker: media_mixer_speaker

media_player:
  - platform: speaker
    name: "Doorbell Speaker"
    task_stack_in_psram: true
    # Never fully silent, so the bell can't be muted by a slip of the slider.
    volume_min: 0.2
    # Ask Home Assistant for 48 kHz mono, the I2S speaker's own format, so the
    # resamplers pass audio through untouched. front_door.flac is 48 kHz mono
    # for the same reason.
    media_pipeline:
      speaker: media_speaker
      format: FLAC
      sample_rate: 48000
      num_channels: 1
    announcement_pipeline:
      speaker: announcement_speaker
      format: FLAC
      sample_rate: 48000
      num_channels: 1
    # Duck music under the chime and announcements, and restore it after.
    on_announcement:
      - mixer_speaker.apply_ducking:
          id: media_mixer_speaker
          decibel_reduction: 20
          duration: 0s
    on_state:
      - if:
          condition:
            not:
              media_player.is_announcing:
          then:
            - mixer_speaker.apply_ducking:
                id: media_mixer_speaker
                decibel_reduction: 0
                duration: 1s
    files:
      - id: front_door_sound
        file: front_door.flac

button:
  - platform: template
    name: "Play Doorbell"
    icon: mdi:bell
    on_press:
      - logger.log: "Playing doorbell"
      - media_player.speaker.play_on_device_media_file:
          media_file: front_door_sound
          announcement: true

# Timestamps for the syslog in debug.yaml. chrony on Home Assistant; ESPHome
# ignores the DHCP NTP option.
time:
  - platform: sntp
    servers:
      - 192.168.0.12
